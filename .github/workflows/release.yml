# Builds JavaLens for Windows, macOS and Linux and publishes a GitHub Release.
#
# To release:   git tag v1.1.0 && git push origin v1.1.0
# To test the build without releasing: Actions tab -> Release -> "Run workflow" (files appear as artifacts).
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: gradle/actions/setup-gradle@v4

      - name: Work out the version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION=$(grep '^version=' gradle.properties | cut -d= -f2)" >> "$GITHUB_ENV"
          fi

      - name: Test
        run: ./gradlew test

      # Windows installers (.msi) need the WiX toolset.
      - name: Install WiX (Windows)
        if: runner.os == 'Windows'
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add --global WixToolset.Util.wixext/5.0.2
          wix extension add --global WixToolset.UI.wixext/5.0.2

      # updateRepo makes the built app check THIS repo's Releases page for updates.
      - name: Build portable app
        run: ./gradlew portable -Pversion="$VERSION" -PupdateRepo="${{ github.repository }}"

      # Guard against archives that lose the execute bit (the launcher, bin/java and jspawnhelper
      # must stay runnable), and on Linux actually start the packaged app and trace a program.
      - name: Check the portable app runs
        if: runner.os != 'Windows'
        run: |
          # (Steps run with bash -e -o pipefail: avoid commands that "fail" just because a glob or pipe ends early.)
          archive=""
          for a in build/dist/*-portable.tar.gz build/dist/*-portable.zip; do
            if [ -f "$a" ]; then archive="$a"; fi
          done
          if [ -z "$archive" ]; then echo "::error::No portable archive in build/dist"; exit 1; fi
          if [ "$RUNNER_OS" = Linux ]; then list=$(tar tvzf "$archive"); else list=$(zipinfo "$archive"); fi
          for f in '/bin/java$' 'jspawnhelper$'; do
            grep -E "^-rwx.*$f" <<< "$list" || { echo "::error::Portable app lost the execute bit on $f"; exit 1; }
          done
          if [ "$RUNNER_OS" = Linux ]; then
            mkdir -p smoke && tar xzf "$archive" -C smoke
            smoke/JavaLens/bin/JavaLens --embedded --port 7171 > smoke/app.log 2>&1 &
            for i in $(seq 1 60); do grep -q listening smoke/app.log && break; sleep 1; done
            python3 -c "import json; print(json.dumps({'code': open('samples/Factorial.java').read(), 'stdin': ''}))" > smoke/req.json
            result=$(curl -sf -X POST -H 'Content-Type: application/json' --data @smoke/req.json http://127.0.0.1:7171/run || true)
            if ! grep -q '4! = 24' <<< "$result"; then
              echo "::error::The packaged app did not run a program"; cat smoke/app.log; exit 1
            fi
            echo "Packaged app traced Factorial correctly"
          fi

      - name: Build installer
        # If the installer step ever breaks on one OS, the portable build is still published.
        continue-on-error: true
        run: ./gradlew installer -Pversion="$VERSION" -PupdateRepo="${{ github.repository }}"

      # One VS Code extension for every OS (it uses the user's own JDK), so build it once.
      - name: Build VS Code extension
        if: runner.os == 'Linux'
        run: ./gradlew vscodeExtension -Pversion="$VERSION" -PupdateRepo="${{ github.repository }}"

      - uses: actions/upload-artifact@v4
        with:
          name: javalens-${{ runner.os }}
          path: build/dist/*
          if-no-files-found: error

  # Publishes the VS Code extension to the Visual Studio Marketplace, so everyone who installed it
  # from there gets the update automatically. Needs the VSCE_PAT secret (an Azure DevOps token with
  # Marketplace > Manage, for the publisher in vscode/package.json).
  publish-vscode:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: javalens-Linux
          path: dist

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Publish to the Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          vsix=$(ls dist/javalens-*.vsix)
          npx --yes @vscode/vsce@3.2.1 publish --packagePath "$vsix"

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            ## Download

            | Your computer | Installer | No-install version |
            |---|---|---|
            | Windows | `JavaLens-*.msi` | `JavaLens-*-windows-portable.zip` |
            | macOS (Apple Silicon) | `JavaLens-*.dmg` | `JavaLens-*-macos-portable.zip` |
            | Linux | `javalens_*.deb` | `JavaLens-*-linux-portable.tar.gz` |

            Java is included; nothing else to install.

            **VS Code extension:** search for **JavaLens** in VS Code's Extensions view and install it; it updates itself.
            (Or download `javalens-*.vsix` and run *Extensions: Install from VSIX...*.)
            Open a `.java` file and click the eye button in the editor's title bar. The extension needs a **JDK 25** installed.

            **First launch:** the app isn't code-signed, so:
            - **Windows:** "Windows protected your PC" → *More info* → *Run anyway*
            - **macOS:** right-click JavaLens → *Open* → *Open* (only the first time)

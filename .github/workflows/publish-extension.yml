# Publishes the VS Code extension of a GitHub Release to both extension stores:
#   - Visual Studio Marketplace  -> VS Code              (secret VSCE_PAT: Azure DevOps token, Marketplace > Manage)
#   - Open VSX                   -> VSCodium, Cursor ... (secret OVSX_PAT: open-vsx.org access token)
# The two run separately, so a problem with one store never holds up the other.
#
# Runs automatically after every release (release.yml calls it). To publish (again) by hand, e.g. after
# fixing a token: Actions tab -> "Publish extension" -> Run workflow, with the release's tag.
name: Publish extension

on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
      stores:
        type: string
        default: both
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag whose .vsix to publish (e.g. v1.4.0)
        required: true
      stores:
        description: Where to publish
        type: choice
        options: [both, marketplace, openvsx]
        default: both

permissions:
  contents: read

jobs:
  marketplace:
    if: inputs.stores == 'both' || inputs.stores == 'marketplace'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Get the .vsix from the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "${{ inputs.tag }}" --repo "${{ github.repository }}" --pattern 'javalens-*.vsix' --dir dist
      - name: Publish to the Visual Studio Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx --yes @vscode/vsce@3.2.1 publish --packagePath dist/javalens-*.vsix

  openvsx:
    if: inputs.stores == 'both' || inputs.stores == 'openvsx'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Get the .vsix from the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "${{ inputs.tag }}" --repo "${{ github.repository }}" --pattern 'javalens-*.vsix' --dir dist
      - name: Publish to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          vsix=$(ls dist/javalens-*.vsix)
          # The namespace must exist and match the publisher in vscode/package.json. Creating it
          # again fails harmlessly ("already exists"), so just try.
          npx --yes ovsx@1.3.0 create-namespace JavaLens -p "$OVSX_PAT" || true
          npx --yes ovsx@1.3.0 publish "$vsix" -p "$OVSX_PAT"
